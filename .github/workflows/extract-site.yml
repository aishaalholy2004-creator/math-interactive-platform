name: Extract math platform

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract platform
        run: |
          mkdir -p /tmp/math-platform
          unzip -q math-interactive-platform-github.zip -d /tmp/math-platform
          cp -a /tmp/math-platform/. .

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Publish math interactive platform"
            git push origin HEAD:main
          fi
